agent:
  seed: 42
  device: cuda:0
  num_steps_per_env: 16
  max_iterations: 2000
  empirical_normalization: false
  obs_groups:
    policy:
    - policy
  clip_actions: null
  check_for_nan: true
  save_interval: 100
  experiment_name: hylion
  run_name: ''
  logger: tensorboard
  neptune_project: isaaclab
  wandb_project: isaaclab
  resume: false
  load_run: .*
  load_checkpoint: model_.*.pt
  class_name: OnPolicyRunner
  actor: {}
  critic: {}
  algorithm:
    class_name: PPO
    num_learning_epochs: 2
    num_mini_batches: 4
    learning_rate: 5.0e-05
    schedule: fixed
    gamma: 0.99
    lam: 0.95
    entropy_coef: 0.007
    desired_kl: 0.005
    max_grad_norm: 0.15
    optimizer: adam
    value_loss_coef: 0.5
    use_clipped_value_loss: true
    clip_param: 0.1
    normalize_advantage_per_mini_batch: false
    share_cnn_encoders: false
    rnd_cfg: null
    symmetry_cfg: null
  policy:
    class_name: ActorCritic
    init_noise_std: 0.5
    noise_std_type: scalar
    state_dependent_std: false
    actor_obs_normalization: {}
    critic_obs_normalization: {}
    actor_hidden_dims:
    - 256
    - 128
    - 128
    critic_hidden_dims:
    - 256
    - 128
    - 128
    activation: elu
